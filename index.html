<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REAL GYM - Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        .logo {
            max-width: 300px;
            height: auto;
            margin-bottom: 25px;
        }

        h1 {
            color: #111111;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* Responsive per schermi più piccoli */
        @media (max-width: 600px) {
            .logo {
                max-width: 200px;
            }
            h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="logo.png" alt="Logo REAL GYM" class="logo">
        <h1>IL SITO REAL GYM ARRIVERÀ PRESTO</h1>
    </div>

</body>
</html>
