<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REAL GYM - Torneremo Presto</title>
    <!-- FONT AWESOME PER L'ICONA DI INSTAGRAM E DELLA MAPPA -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            border: none !important; /* Rimozione globale dei bordi */
            outline: none;
        }

        body {
            background-color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px 30px 20px;
            color: #111111;
        }

        /* SCHERMATA DI CARICAMENTO MINIMAL */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        #loader .loader-logo {
            max-width: 200px;
            height: auto;
            object-fit: contain;
        }

        /* BARRA DI CARICAMENTO ANCORATA AL MARGINE BASSO */
        .progress-container {
            position: absolute;
            bottom: 40px; /* Distanza dal fondo dello schermo */
            left: 50%;
            transform: translateX(-50%); /* Centra orizzontalmente */
            width: 200px;
            height: 6px;
            background-color: #f0f0f0;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background-color: #888888;
            border-radius: 10px;
            animation: load 4s linear forwards;
        }

        @keyframes load {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* NASCONDE LO SCHERMO DI CARICAMENTO */
        .loader-hidden {
            opacity: 0;
            visibility: hidden;
        }

        .main-content {
            text-align: center;
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: auto 0; /* Centra verticalmente il contenuto principale */
        }

        .logo {
            max-width: 260px;
            height: auto;
            margin-bottom: 25px;
            object-fit: contain;
        }

        h1 {
            color: #111111;
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 25px;
            line-height: 1.3;
        }

        /* BOX GRIGIA "COMING SOON" */
        .coming-soon-box {
            background-color: #e8e8e8;
            color: #FF0000;
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 2px;
            padding: 12px 28px;
            border-radius: 12px; /* Spigoli arrotondati */
            display: inline-block;
            text-transform: uppercase;
        }

        /* INFO IN FONDO ALLA PAGINA */
        .info-footer {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            font-size: 0.85rem;
            color: #555555;
            margin-top: 40px;
            width: 100%;
        }

        .location-link {
            color: #555555;
            text-decoration: none;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s ease;
        }

        .location-link:hover {
            color: #FF0000;
        }

        .instagram-link {
            color: #111111;
            text-decoration: none;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: color 0.2s ease;
        }

        .instagram-link:hover {
            color: #FF0000;
        }

        /* RESPONSIVE PER SMARTPHONE */
        @media (max-width: 600px) {
            #loader .loader-logo {
                max-width: 160px;
            }
            .progress-container {
                width: 160px;
                bottom: 30px; /* Leggermente più vicino al bordo sui telefoni */
            }
            .logo {
                max-width: 190px;
            }
            h1 {
                font-size: 1.25rem;
            }
            .coming-soon-box {
                font-size: 1rem;
                padding: 10px 22px;
            }
            .info-footer {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <!-- SCHERMATA DI CARICAMENTO (4 SECONDI) -->
    <div id="loader">
        <img src="logo.png" alt="Logo REAL GYM" class="loader-logo" onerror="this.onerror=null; this.style.display='none';">
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
    </div>

    <!-- CONTENUTO PRINCIPALE (LOGO, MESSAGGIO E COMING SOON) -->
    <div class="main-content">
        <!-- LOGO -->
        <img src="logo.png" alt="Logo REAL GYM" class="logo" onerror="this.onerror=null; this.style.display='none';">
        
        <!-- MESSAGGIO PRINCIPALE -->
        <h1>IL SITO REAL GYM TORNERA' PRESTO CON NUOVE NOVITA'</h1>
        
        <!-- BOX COMING SOON -->
        <div class="coming-soon-box">
            COMING SOON
        </div>
    </div>

    <!-- INFORMAZIONI IN FONDO ALLA PAGINA -->
    <div class="info-footer">
        <!-- LINK A GOOGLE MAPS PER LA POSIZIONE -->
        <a href="https://www.google.com/maps/search/?api=1&query=via+campania+copertino+LE" target="_blank" class="location-link" title="Apri su Google Maps">
            <i class="fa-solid fa-location-dot" style="color: #FF0000;"></i> copertino LE via campania
        </a>
        
        <!-- LINK A INSTAGRAM -->
        <a href="https://www.instagram.com/_therealgym_?stkn=MXhwcnB0aHhwYmMwcg==" target="_blank" class="instagram-link">
            <i class="fa-brands fa-instagram" style="font-size: 1.1rem; color: #E1306C;"></i> Seguici su Instagram
        </a>
    </div>

    <!-- SCRIPT PER NASCONDERE IL LOADER DOPO ESATTAMENTE 4 SECONDI -->
    <script>
        setTimeout(function() {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.classList.add('loader-hidden');
            }
        }, 4000);
    </script>

</body>
</html>
